<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca — Promoción a la Salud · Jurisdicción Sanitaria Texcoco</title>
  <meta name="description" content="Biblioteca de recursos del Departamento de Promoción a la Salud: lineamientos, manuales, formatos, NOMs, material gráfico y presentaciones.">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/img/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#9F2241">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261008a">
</head>
<body>

  <div id="site-nav"></div>

  <main id="main" tabindex="-1">

    <!-- ════════ HERO DE PÁGINA ════════ -->
    <div class="page-hero" style="--ph-color: var(--gold-dk)">
      <div class="container">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
          <a href="index.html">Inicio</a>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          <span>Biblioteca</span>
        </nav>
        <h1 class="ph-title">Biblioteca de Recursos</h1>
        <p class="ph-desc">Lineamientos, manuales, formatos, NOMs, material gráfico y presentaciones para el personal promotor.</p>
      </div>
    </div>

    <!-- ════════ BÚSQUEDA + FILTROS FACETADOS ════════
         Tres facetas independientes sobre el mismo índice:
         programa · tipo · tema. El estado va a la URL, así que
         otras páginas enlazan aquí ya filtrado
         (biblioteca.html?programa=entornos&tipo=formato). -->
    <div class="filter-bar-wrap">
      <div class="container">

        <div class="filter-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <label class="visually-hidden" for="buscador">Buscar en la biblioteca</label>
          <input type="search" id="buscador" placeholder="Buscar por nombre, tema o público…" autocomplete="off">
        </div>

        <div class="filter-group">
          <span class="filter-label" id="lbl-programa">Programa</span>
          <div class="filter-bar" role="group" aria-labelledby="lbl-programa">
            <button class="filter-btn" data-faceta="programa" data-valor="promocion"    aria-pressed="false">Promoción</button>
            <button class="filter-btn" data-faceta="programa" data-valor="adicciones"   aria-pressed="false">Adicciones</button>
            <button class="filter-btn" data-faceta="programa" data-valor="salud-mental" aria-pressed="false">Salud Mental</button>
            <button class="filter-btn" data-faceta="programa" data-valor="entornos"     aria-pressed="false">Entornos</button>
            <button class="filter-btn" data-faceta="programa" data-valor="transversal"  aria-pressed="false">Transversal</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label" id="lbl-tipo">Tipo de recurso</span>
          <div class="filter-bar" role="group" aria-labelledby="lbl-tipo">
            <button class="filter-btn" data-faceta="tipo" data-valor="formato"      aria-pressed="false">Formatos</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="taller"       aria-pressed="false">Talleres</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="formulario"   aria-pressed="false">Formularios</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="normativa"    aria-pressed="false">Lineamientos</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="nom"          aria-pressed="false">NOMs</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="manual"       aria-pressed="false">Manuales</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="grafico"      aria-pressed="false">Material gráfico</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="presentacion" aria-pressed="false">Presentaciones</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="documento"    aria-pressed="false">Docs. oficiales</button>
            <button class="filter-btn" data-faceta="tipo" data-valor="enlace"       aria-pressed="false">Sitios externos</button>
          </div>
        </div>

        <p class="filter-count-wrap">
          <span class="filter-count" role="status">…</span> disponibles
          <button type="button" class="filter-clear">Quitar filtros</button>
        </p>
      </div>
    </div>

    <!-- ════════ GRID DE MATERIALES ════════ -->
    <section class="section-block" id="materiales">
      <div class="container">
        <div class="filter-heading" hidden></div>
        <div class="material-grid" data-recursos></div>
        <p class="filter-empty empty-state" hidden>
          Ningún recurso coincide con esos filtros.
          <button type="button" class="filter-clear">Ver todos los recursos</button>
        </p>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="assets/data/recursos.js?v=20261008a"></script>
  <script src="components.js?v=20261008a"></script>
  <script src="script.js?v=20261008a"></script>
</body>
</html>
